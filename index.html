<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>百味源餐馆</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- 样式部分 CSS --- */
        body {
            /* 使用 Telegram 定义的变量，自动适配深色/浅色模式 */
            background-color: var(--tg-theme-bg-color, #fff); 
            color: var(--tg-theme-text-color, #000);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            padding: 15px;
            padding-bottom: 50px; 
        }

        /* 餐馆标题样式 */
        .restaurant-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 20px;
            color: var(--tg-theme-text-color, #000);
        }

        /* 调试用的版本号样式 */
        .version-tag {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
        }

        /* 菜品卡片样式 */
        .item-card {
            display: flex;
            align-items: center;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            margin-bottom: 12px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .item-img {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            background-color: #e0e0e0;
            object-fit: cover;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .item-price {
            color: var(--tg-theme-link-color, #2481cc);
            font-weight: 600;
        }

        /* 加减按钮控制区 */
        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.7;
        }

        .btn-remove {
            background-color: #e53935; 
            display: none; 
        }

        .count {
            font-weight: bold;
            font-size: 16px;
            min-width: 20px;
            text-align: center;
            display: none; 
        }

        /* 备注输入框样式 */
        .remark-section {
            margin-top: 20px;
            padding: 10px;
            background-color: var(--tg-theme-secondary-bg-color
